weights: hypir_weights.pth
tokenizer: tokenizer
model_t: 200
coeff_t: 200
patch_size: 512
stride: 256
seed: 231
op_backend: cuda        # 纯 CUDA 提交：加载不了直接抛错，不静默降级（要容错改成 auto）
channels_last: auto   # auto = 跟随 CSIG_OP_BACKEND 选中的后端；也可写 true/false 强制
prompt: 'A high-resolution photograph with fine natural detail: modern Chinese city high-rise buildings with glass curtain walls and tiled facades, construction cranes and shop signage, distant hills, and
  close-up green foliage with flowers.'
